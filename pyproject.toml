[project]
name = "deep_agent"
version = "0.1.0"
description = "Deep Agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ag-ui-langgraph>=0.0.44",
    "copilotkit>=0.1.96",
    "deepagents>=0.4.0",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "langgraph>=1.0.0",
    "langgraph-sdk>=0.3.15",
    "langsmith>=0.8.18",
    "podman>=5.8.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.41.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=9.0.3",
    "ruff>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agent"]
